name: etl

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  run-etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m etl.pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SOURCE_API_URL: ${{ vars.SOURCE_API_URL }}
